<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Vibe Prompter: a free, private, voice-controlled teleprompter that follows your pace. One HTML file, no install, no account.">
    <meta name="theme-color" content="#030712">
    <title>Vibe Prompter</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z'/%3E%3Cpath d='M19 10v2a7 7 0 0 1-14 0v-2'/%3E%3Cline x1='12' y1='19' x2='12' y2='22'/%3E%3C/svg%3E">
    <style>
        :root {
            --bg: #030712;
            --panel: #0b1220;
            --panel-2: #111827;
            --panel-3: #1f2937;
            --border: #1f2937;
            --text: #f3f4f6;
            --muted: #9ca3af;
            --accent: #3b82f6;
            --accent-hover: #60a5fa;
            --accent-2: #6366f1;
            --danger: #dc2626;
            --ok: #4ade80;
            --past: rgba(74, 222, 128, 0.72);

            /* Prompter settings (updated from JS) */
            --font-size: 30px;
            --line-height: 1.6;
            --side: 20%;
            --eyeline: 40%;
            --flip: none;
        }

        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Hebrew", "Noto Sans Arabic", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        button, input, select, textarea { font: inherit; color: inherit; }
        button { cursor: pointer; }
        [hidden] { display: none !important; }

        .sr-only {
            position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
        }

        :focus-visible { outline: 2px solid var(--accent-hover); outline-offset: 2px; }

        .app { display: flex; height: 100vh; height: 100dvh; overflow: hidden; }

        /* ---------- Settings panel ---------- */
        .panel {
            width: 340px;
            flex-shrink: 0;
            overflow-y: auto;
            background: var(--panel);
            border-inline-end: 1px solid var(--border);
            padding: 20px 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            scrollbar-width: thin;
            scrollbar-color: var(--panel-3) transparent;
        }

        .panel-head {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            padding-bottom: 14px; border-bottom: 1px solid var(--border);
        }
        .brand { display: flex; align-items: center; gap: 10px; color: var(--accent); }
        .brand h1 { margin: 0; font-size: 19px; font-weight: 700; color: var(--text); }

        .field { display: flex; flex-direction: column; gap: 8px; }
        .field-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .label { font-size: 13px; font-weight: 600; color: var(--muted); }
        output, .value { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
        .hint { margin: 0; font-size: 12px; line-height: 1.45; color: var(--muted); }

        .badge {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 11px; font-weight: 600; color: #d1d5db;
            background: var(--panel-3); border-radius: 6px; padding: 3px 7px;
            white-space: nowrap;
        }

        textarea {
            width: 100%;
            min-height: 180px;
            resize: vertical;
            background: var(--panel-2);
            border: 1px solid var(--panel-3);
            border-radius: 10px;
            padding: 12px;
            font-size: 14px;
            line-height: 1.55;
        }
        textarea:focus, .select:focus { outline: none; border-color: var(--accent); }

        .select {
            width: 100%;
            background: var(--panel-2);
            border: 1px solid var(--panel-3);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 14px;
        }
        .select-sm { width: auto; padding: 4px 8px; font-size: 13px; }

        input[type="range"] { width: 100%; accent-color: var(--accent); margin: 0; }

        .seg { display: flex; gap: 6px; }
        .seg button {
            flex: 1;
            padding: 8px 6px;
            border: 1px solid transparent;
            border-radius: 8px;
            background: var(--panel-3);
            font-size: 13px;
            font-weight: 500;
            transition: background-color .15s;
        }
        .seg button:hover:not(:disabled) { background: #374151; }
        .seg button[aria-pressed="true"], .seg button[aria-checked="true"] { background: var(--accent); color: #fff; }
        .seg.toggles button[aria-pressed="true"] { background: var(--accent-2); }
        .seg button:disabled { opacity: .45; cursor: not-allowed; }

        .notice {
            background: rgba(127, 29, 29, .45);
            border: 1px solid rgba(248, 113, 113, .35);
            color: #fca5a5;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 13px;
            line-height: 1.45;
        }

        details.shortcuts { font-size: 13px; color: var(--muted); }
        details.shortcuts summary { cursor: pointer; font-weight: 600; }
        details.shortcuts dl {
            display: grid; grid-template-columns: auto 1fr; gap: 6px 12px;
            margin: 10px 0 0; align-items: center;
        }
        details.shortcuts dd { margin: 0; }
        kbd {
            display: inline-block; min-width: 1.6em; text-align: center;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px;
            background: var(--panel-3); border: 1px solid #374151; border-bottom-width: 2px;
            border-radius: 4px; padding: 1px 5px; color: #e5e7eb;
        }

        .actions { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding-top: 6px; }
        .btn-primary {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%; padding: 15px; border: 0; border-radius: 10px;
            background: var(--accent); color: #fff; font-size: 16px; font-weight: 700;
            box-shadow: 0 10px 24px -12px rgba(59, 130, 246, .8);
            transition: background-color .15s;
        }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-ghost {
            border: 0; background: none; color: var(--muted); font-size: 13px; padding: 4px;
            text-decoration: underline; text-underline-offset: 3px;
        }
        .btn-ghost:hover { color: var(--text); }

        /* ---------- Prompter stage ---------- */
        .stage { flex: 1; position: relative; min-width: 0; background: #000; overflow: hidden; }
        .display { position: absolute; inset: 0; }
        body.playing .display { transform: var(--flip); }

        .scroller {
            position: relative; /* offsetParent for word measurement */
            height: 100%;
            overflow-y: auto;
            scrollbar-width: none;
        }
        .scroller::-webkit-scrollbar { display: none; }
        body.playing .scroller { overflow: hidden; }

        .script-view {
            max-width: 80rem;
            margin: 0 auto;
            padding: 100vh var(--side);
            font-size: var(--font-size);
            line-height: var(--line-height);
            font-weight: 700;
            overflow-wrap: anywhere;
            will-change: transform;
        }
        .script-view .line { min-height: calc(var(--font-size) * var(--line-height)); }

        .w { border-radius: .12em; transition: color .3s; cursor: pointer; }
        .w:hover { color: #93c5fd; }
        .w.past { color: var(--past); }
        .w.cur {
            text-decoration: underline;
            text-decoration-color: var(--accent);
            text-decoration-thickness: max(3px, .1em);
            text-underline-offset: .22em;
        }

        .eyeline {
            position: absolute; left: 0; right: 0; top: var(--eyeline);
            height: 3px; transform: translateY(-50%);
            background: linear-gradient(90deg, transparent, rgba(59, 130, 246, .28) 20%, rgba(59, 130, 246, .28) 80%, transparent);
            pointer-events: none;
        }
        .eyeline::before, .eyeline::after {
            content: ""; position: absolute; top: 50%; transform: translateY(-50%);
            border: 9px solid transparent;
        }
        .eyeline::before { left: 0; border-left-color: rgba(59, 130, 246, .7); }
        .eyeline::after { right: 0; border-right-color: rgba(59, 130, 246, .7); }

        .empty-state {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            color: #4b5563; font-size: 18px; padding: 24px; text-align: center; pointer-events: none;
        }

        /* HUD (never mirrored, so the operator can always read it) */
        .hud {
            position: absolute; top: 12px; inset-inline-end: 12px; z-index: 5;
            display: none; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 8px;
            max-width: calc(100% - 24px);
            transition: opacity .35s;
        }
        body.playing .hud { display: flex; }
        body.hud-idle .hud { opacity: 0; pointer-events: none; }
        body.hud-idle .stage { cursor: none; }

        .hud-btn, .hud-pill {
            display: inline-flex; align-items: center; gap: 6px;
            height: 42px; padding: 0 14px; border: 0; border-radius: 999px;
            background: rgba(31, 41, 55, .85); color: #e5e7eb;
            font-size: 14px; font-weight: 600;
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
            box-shadow: 0 6px 20px -8px rgba(0, 0, 0, .8);
        }
        .hud-btn:hover { background: rgba(55, 65, 81, .95); }
        .hud-btn.danger { background: rgba(220, 38, 38, .85); color: #fff; }
        .hud-btn.danger:hover { background: #ef4444; }
        .hud-btn.icon { width: 42px; padding: 0; justify-content: center; }
        .hud-pill { padding: 0 6px; gap: 2px; }
        .hud-pill button {
            width: 30px; height: 30px; border: 0; border-radius: 999px; background: transparent;
            font-size: 18px; font-weight: 700; line-height: 1;
        }
        .hud-pill button:hover { background: rgba(255, 255, 255, .1); }
        .hud-pill .value { color: #e5e7eb; min-width: 64px; text-align: center; font-size: 13px; }
        .hud-time { font-variant-numeric: tabular-nums; font-weight: 500; }
        .mic { transition: background-color .4s, color .4s; }
        .mic.on { background: rgba(34, 197, 94, .2); color: var(--ok); }
        .mic.on svg { animation: pulse 1.6s ease-in-out infinite; }
        @keyframes pulse { 50% { opacity: .45; } }

        .progress {
            position: absolute; left: 0; right: 0; bottom: 0; height: 4px; z-index: 4;
            background: rgba(255, 255, 255, .06); display: none;
        }
        body.playing .progress { display: block; }
        .progress > div { height: 100%; width: 0; background: var(--accent); transition: width .3s linear; }
        [dir="rtl"] .progress > div { margin-inline-start: 0; }

        .status-badge {
            position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 5;
            background: rgba(31, 41, 55, .9); color: #fff; font-weight: 700; font-size: 15px;
            padding: 10px 18px; border-radius: 999px; pointer-events: none;
        }

        .toast {
            position: absolute; left: 50%; top: 70px; transform: translateX(-50%); z-index: 6;
            width: min(520px, calc(100% - 32px));
            background: rgba(127, 29, 29, .92); color: #fee2e2; font-size: 14px; line-height: 1.45;
            border-radius: 10px; padding: 12px 16px; box-shadow: 0 10px 30px -10px #000;
        }

        /* ---------- Mobile ---------- */
        @media (max-width: 768px) {
            .app { flex-direction: column; }
            .panel { width: 100%; max-height: 58%; border-inline-end: 0; border-bottom: 1px solid var(--border); padding: 16px; }
            textarea { min-height: 120px; }
            .actions { position: sticky; bottom: -16px; background: var(--panel); padding: 10px 0 16px; margin-bottom: -16px; }
            .stage { min-height: 42%; }
            .hud-label { display: none; }
        }

        body.playing .panel { display: none; }

        @media (prefers-reduced-motion: reduce) {
            .w, .progress > div, .hud { transition: none; }
            .mic.on svg { animation: none; }
        }
    </style>
</head>
<body>
<noscript><p style="padding:24px;color:#fff">Vibe Prompter needs JavaScript enabled.</p></noscript>

<div class="app" id="app">
    <!-- ================= Settings panel ================= -->
    <aside class="panel" id="panel">
        <header class="panel-head">
            <div class="brand">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
                <h1 data-i18n="appTitle">Vibe Prompter</h1>
            </div>
            <label class="sr-only" for="uiLang" data-i18n="uiLang">Interface language</label>
            <select id="uiLang" class="select select-sm">
                <option value="en">English</option>
                <option value="he">עברית</option>
                <option value="es">Español</option>
                <option value="fr">Français</option>
            </select>
        </header>

        <div id="notice" class="notice" role="alert" hidden></div>

        <section class="field">
            <div class="field-row">
                <label class="label" for="script" data-i18n="script">Your script</label>
                <span class="badge" id="detectedBadge"></span>
            </div>
            <textarea id="script" dir="auto" spellcheck="false"></textarea>
            <p class="hint" id="scriptStats"></p>
        </section>

        <section class="field">
            <span class="label" id="modeLabel" data-i18n="mode">Scroll mode</span>
            <div class="seg" role="radiogroup" aria-labelledby="modeLabel">
                <button type="button" role="radio" data-mode="voice" data-i18n="modeVoice">Voice follow</button>
                <button type="button" role="radio" data-mode="auto" data-i18n="modeAuto">Auto-scroll</button>
            </div>
            <p class="hint" id="modeHint"></p>
        </section>

        <section class="field" id="speechLangField">
            <label class="label" for="speechLang" data-i18n="speechLang">Speech language</label>
            <select id="speechLang" class="select"></select>
        </section>

        <section class="field">
            <div class="field-row"><label class="label" for="wpm" data-i18n="speed">Speed</label><output id="wpmOut" for="wpm"></output></div>
            <input type="range" id="wpm" min="60" max="260" step="5">
        </section>

        <section class="field">
            <div class="field-row"><label class="label" for="fontSize" data-i18n="fontSize">Font size</label><output id="fontSizeOut" for="fontSize"></output></div>
            <input type="range" id="fontSize" min="20" max="120" step="1">
        </section>

        <section class="field">
            <div class="field-row"><label class="label" for="lineHeight" data-i18n="lineHeight">Line spacing</label><output id="lineHeightOut" for="lineHeight"></output></div>
            <input type="range" id="lineHeight" min="1.1" max="2.4" step="0.1">
        </section>

        <section class="field">
            <div class="field-row"><label class="label" for="padding" data-i18n="padding">Side margins</label><output id="paddingOut" for="padding"></output></div>
            <input type="range" id="padding" min="0" max="40" step="1">
        </section>

        <section class="field">
            <div class="field-row"><label class="label" for="eyeline" data-i18n="eyeline">Eye-line position</label><output id="eyelineOut" for="eyeline"></output></div>
            <input type="range" id="eyeline" min="15" max="70" step="1">
        </section>

        <section class="field">
            <span class="label" id="alignLabel" data-i18n="align">Text alignment</span>
            <div class="seg" role="radiogroup" aria-labelledby="alignLabel">
                <button type="button" role="radio" data-align="left" data-i18n="left">Left</button>
                <button type="button" role="radio" data-align="center" data-i18n="center">Center</button>
                <button type="button" role="radio" data-align="right" data-i18n="right">Right</button>
            </div>
        </section>

        <section class="field">
            <span class="label" data-i18n="physical">Physical prompter</span>
            <div class="seg toggles">
                <button type="button" id="mirrorBtn" aria-pressed="false" data-i18n="flipH">Mirror horizontally</button>
                <button type="button" id="flipVBtn" aria-pressed="false" data-i18n="flipV">Flip vertically</button>
            </div>
            <p class="hint" data-i18n="physicalHint"></p>
        </section>

        <details class="shortcuts">
            <summary data-i18n="shortcuts">Keyboard &amp; remote shortcuts</summary>
            <dl>
                <dt><kbd>Space</kbd></dt><dd data-i18n="scSpace"></dd>
                <dt><kbd>Esc</kbd></dt><dd data-i18n="scEsc"></dd>
                <dt><kbd>↑</kbd> <kbd>↓</kbd></dt><dd data-i18n="scArrows"></dd>
                <dt><kbd>PgUp</kbd> <kbd>PgDn</kbd></dt><dd data-i18n="scPage"></dd>
                <dt><kbd>Home</kbd></dt><dd data-i18n="scHome"></dd>
                <dt><kbd>−</kbd> <kbd>+</kbd></dt><dd data-i18n="scSpeed"></dd>
                <dt><kbd>F</kbd></dt><dd data-i18n="scFull"></dd>
                <dt>🖱️</dt><dd data-i18n="scClick"></dd>
            </dl>
        </details>

        <div class="actions">
            <button type="button" id="startBtn" class="btn-primary">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg>
                <span id="startLabel"></span>
            </button>
            <button type="button" id="toTopBtn" class="btn-ghost" data-i18n="toTop" hidden>Back to top</button>
        </div>
    </aside>

    <!-- ================= Prompter stage ================= -->
    <main class="stage" id="stage">
        <div class="display" id="display">
            <div class="scroller" id="scroller">
                <div class="script-view" id="scriptView"></div>
            </div>
            <div class="eyeline" aria-hidden="true"></div>
        </div>
        <div class="empty-state" id="emptyState" data-i18n="emptyScript" hidden></div>

        <div class="hud" id="hud">
            <button type="button" class="hud-btn danger" id="stopBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
                <span class="hud-label" data-i18n="stop">Stop</span>
            </button>
            <button type="button" class="hud-btn" id="pauseBtn">
                <svg id="pauseIcon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1"/><rect x="14" y="4" width="5" height="16" rx="1"/></svg>
                <svg id="playIcon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" hidden><polygon points="6 3 20 12 6 21 6 3"/></svg>
                <span class="hud-label" id="pauseLabel"></span>
            </button>
            <div class="hud-pill" role="group">
                <button type="button" id="slowerBtn">−</button>
                <span class="value" id="wpmReadout" aria-live="off"></span>
                <button type="button" id="fasterBtn">+</button>
            </div>
            <div class="hud-pill mic" id="micChip" style="padding: 0 14px; gap: 6px;">
                <svg id="micOnIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
                <svg id="micOffIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="2" y1="2" x2="22" y2="22"/><path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2"/><path d="M5 10v2a7 7 0 0 0 12 5"/><path d="M15 9.34V5a3 3 0 0 0-5.68-1.33"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
                <span class="hud-label" id="micLabel"></span>
            </div>
            <div class="hud-pill hud-time" id="timeReadout" dir="ltr" style="padding: 0 14px;"></div>
            <button type="button" class="hud-btn icon" id="fsBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
            </button>
        </div>

        <div class="progress" aria-hidden="true"><div id="progressBar"></div></div>
        <div class="status-badge" id="statusBadge" role="status" hidden></div>
        <div class="toast" id="toast" role="alert" hidden></div>
    </main>
</div>

<script>
(() => {
    'use strict';

    // =====================================================================
    //  Translations
    // =====================================================================
    const I18N = {
        en: {
            appTitle: 'Vibe Prompter',
            uiLang: 'Interface language',
            script: 'Your script',
            detected: 'Detected: {lang}',
            stats: '{words} words · ~{min} min at {wpm} wpm',
            mode: 'Scroll mode',
            modeVoice: 'Voice follow',
            modeAuto: 'Auto-scroll',
            modeVoiceHint: 'Listens to you and follows your pace. Keeps cruising through words it misses, and waits when you stop talking.',
            modeAutoHint: 'Scrolls at a constant speed. Works in every browser, no microphone needed.',
            speechLang: 'Speech language',
            autoDetect: 'Auto: {lang}',
            speed: 'Speed',
            wpmUnit: 'wpm',
            fontSize: 'Font size',
            lineHeight: 'Line spacing',
            padding: 'Side margins',
            eyeline: 'Eye-line position',
            align: 'Text alignment',
            left: 'Left',
            center: 'Center',
            right: 'Right',
            physical: 'Physical prompter (beam-splitter glass)',
            physicalHint: 'Flips apply while reading, so the editor stays readable.',
            flipH: 'Mirror horizontally',
            flipV: 'Flip vertically',
            start: 'Start reading',
            startFrom: 'Start from word {n}',
            toTop: 'Back to the top',
            stop: 'Stop',
            pause: 'Pause',
            resume: 'Resume',
            paused: 'Paused · Space to resume',
            end: 'End of script',
            listening: 'Listening…',
            micOff: 'Mic off',
            fullscreen: 'Full screen',

            lines.push(line);

        while (lines.length && !lines[0].length) lines.shift();

    function editDistance(a, b, max) {

        for (let i = 1; i <= a.length; i++) {
            const curr = [i];
            let rowMin = i;
            for (let j = 1; j <= b.length; j++) {
                curr[j] = Math.min(prev[j] + 1, curr[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
                if (curr[j] < rowMin) rowMin = curr[j];
            }
            if (rowMin > max) return max + 1;
            prev = curr;
        }
        return prev[b.length];
    }

        let current = null;
        state.wordEls.forEach((span, i) => {
            const top = span.offsetTop;
            const height = span.offsetHeight;
            if (!current || Math.abs(top - current.top) > height * 0.5) {
                current = { start: i, end: i, top, height };
                lines.push(current);
            } else {
                current.end = i;
            }
            wordLine[i] = lines.length - 1;
        });
        const cs = getComputedStyle(el.scriptView);
        const pitch = parseFloat(cs.fontSize) * settings.lineHeight;
        state.layout = { lines, wordLine, pitch };
        state.layoutDirty = false;
    }

    /** Scroll offset that places (fractional) word position `pos` on the eye-line. */
    function scrollTargetFor(pos) {
        if (state.layoutDirty || !state.layout) computeLayout();
        const { lines, wordLine, pitch } = state.layout;
        if (!lines.length) return 0;
        const n = state.wordEls.length;
        const i = clamp(Math.floor(pos), 0, n - 1);
        const f = i >= n - 1 ? 0 : clamp(pos - i, 0, 1);
        const lineIndex = wordLine[i];
        const line = lines[lineIndex];
        const next = lines[lineIndex + 1];
        const step = next ? Math.min(next.top - line.top, pitch) : pitch;
        const progress = (i - line.start + f) / (line.end - line.start + 1);
        const center = line.top + line.height / 2 + (progress - 0.5) * step;
        return center - el.scroller.clientHeight * (settings.eyeline / 100);
    }

    function positionPreview() {
        if (state.playing || !state.wordEls.length) return;
        el.scroller.scrollTop = scrollTargetFor(state.idx);
    }

    // =====================================================================
    //  Position management
    // =====================================================================
    function setIndex(next, manual = false) {
        const n = state.words.length;
        if (!n) return;
        next = clamp(next, 0, n - 1);
        const prev = state.idx;
        state.idx = next;
        if (manual) {
            state.confirmed = next;
            state.frac = 0;
            state.paceHistory = [];
            voice.resetTranscript();
            if (state.atEnd && next < n - 1) setStatus(state.paused ? t('paused') : null);
            state.atEnd = false;
        }
        if (prev !== next) paintRange(prev, next);
        updateProgress();
        if (!state.playing) {
            updateStartButton();
            positionPreview();
        }
    }

    function stepWords(delta) { setIndex(state.idx + delta, true); }

    function stepLines(delta) {
        if (state.layoutDirty || !state.layout) computeLayout();
        const { lines, wordLine } = state.layout;
        if (!lines.length) return;
        const target = clamp(wordLine[state.idx] + delta, 0, lines.length - 1);
        setIndex(lines[target].start, true);
    }

    // =====================================================================
    //  Speech recognition (voice follow)
    // =====================================================================
    const voice = {
        rec: null,
        lang: '',
        wanted: false,
        restartTimer: 0,
        restartDelay: 250,
        lastTranscript: '',

        start(lang) {
            if (!voiceSupported) return;
            this.wanted = true;
            if (!this.rec || this.lang !== lang) {
                this.dispose();
                this.rec = this.create(lang);
                this.lang = lang;
            }
            this.resetTranscript();
            this.tryStart();
        },

        stop() {
            this.wanted = false;
            clearTimeout(this.restartTimer);
            if (this.rec) { try { this.rec.abort(); } catch (e) { /* not running */ } }
            setListening(false);
        },

        dispose() {
            if (!this.rec) return;
            const r = this.rec;
            r.onstart = r.onresult = r.onerror = r.onend = null;
            try { r.abort(); } catch (e) { /* not running */ }
            this.rec = null;
        },

        tryStart() {
            clearTimeout(this.restartTimer);
            if (!this.rec || !this.wanted) return;
            try { this.rec.start(); } catch (e) { /* already started */ }
        },

        resetTranscript() { this.lastTranscript = ''; },

        create(lang) {
            const rec = new SpeechRecognition();
            rec.lang = lang;
            rec.continuous = true;
            rec.interimResults = true;
            rec.maxAlternatives = 1;

            rec.onstart = () => { setListening(true); };
            rec.onresult = (event) => {
                this.restartDelay = 250;
                handleSpeech(event);
            };
            rec.onerror = (event) => {
                switch (event.error) {
                    case 'not-allowed':
                    case 'service-not-allowed':
                        this.wanted = false;
                        showNotice(t('errMic'));
                        break;
                    case 'audio-capture':
                        this.wanted = false;
                        showNotice(t('errNoMic'));
                        break;
                    case 'language-not-supported':
                        this.wanted = false;
                        showNotice(t('errLang', { lang: langName(lang) }));
                        break;
                    case 'network':
                        this.restartDelay = Math.min(this.restartDelay * 2, 8000);
                        showNotice(t('errNetwork'));
                        break;
                    default: // 'no-speech', 'aborted': harmless, we just restart
                        break;
                }
            };
            rec.onend = () => {
                setListening(false);
                this.resetTranscript();
                // Browsers end recognition sessions on silence or after a while; keep it alive.
                if (this.wanted) this.restartTimer = setTimeout(() => this.tryStart(), this.restartDelay);
            };
            return rec;
        }
    };

    function handleSpeech(event) {
        if (!state.playing || state.paused) return;
        state.lastSoundAt = performance.now();

        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
            transcript += ' ' + event.results[i][0].transcript;
        }
        transcript = transcript.trim();
        if (!transcript || transcript === voice.lastTranscript) return;
        voice.lastTranscript = transcript;

        const spoken = transcript.split(/\s+/).map(cleanWord).filter(Boolean);
        if (!spoken.length) return;

        const next = matchSpeech(spoken);
        if (next > state.confirmed) {
            state.confirmed = next;
            recordPace(next);
            if (next > state.idx) {
                state.frac = 0;
                setIndex(next);
            }
        }
    }

    /**
     * Context-lock matching: finds where the speaker is, searching forward from the last
     * confirmed position. Nearby matches are accepted directly (only against the freshest
     * spoken words); bigger jumps must also match the preceding word, so a repeated word
     * or phrase further down the script can't pull the prompter ahead.
     */
    function matchSpeech(spoken) {
        const words = state.words;
        const tail = spoken.slice(-6);
        const n = tail.length;
        const base = state.confirmed;
        const end = Math.min(words.length, Math.max(state.idx, base) + SEARCH_AHEAD);
        let best = base;

        for (let i = base; i < end; i++) {
            const target = words[i].clean;
            if (!target) continue;

            let j = -1;
            for (let k = n - 1; k >= 0; k--) {
                if (similar(target, tail[k])) { j = k; break; }
            }
            if (j < 0) continue;

            const gap = i - best;
            const fresh = j >= n - 3;
            let context = false;
            if (j > 0) {
                let p = i - 1;
                while (p >= 0 && !words[p].clean) p--;
                context = p >= 0 && similar(words[p].clean, tail[j - 1]);
            }

            if ((gap <= 2 && fresh) || (context && (best === base || gap <= 4))) {
                best = i + 1;
                if (j === n - 1) break; // matched the newest spoken word: that's where we are
            }
        }
        return Math.min(best, words.length - 1);
    }

    /** Estimates reading pace from confirmed positions over a sliding window. */
    function recordPace(index) {
        const now = performance.now();
        const hist = state.paceHistory;
        hist.push({ t: now, i: index });
        while (hist.length > 2 && now - hist[0].t > 15000) hist.shift();
        const first = hist[0];
        const seconds = (now - first.t) / 1000;
        const words = index - first.i;
        if (seconds > 2.5 && words > 3) {
            const measured = clamp(words / seconds, 0.8, 5);
            state.wps = state.wps * 0.5 + measured * 0.5;
        }
    }

    function setListening(on) {
        state.listening = on;
        el.micChip.classList.toggle('on', on);
        // SVG elements have no `hidden` property, so toggle the attribute directly.
        el.micOnIcon.toggleAttribute('hidden', !on);
        el.micOffIcon.toggleAttribute('hidden', on);
        el.micLabel.textContent = on ? t('listening') : t('micOff');
    }

    // =====================================================================
    //  Playback engine
    // =====================================================================
    function start() {
        if (!state.words.length) { showNotice(t('emptyScript')); return; }
        hideNotice();
        if (state.idx >= state.words.length - 1) setIndex(0, true);

        state.playing = true;
        state.paused = false;
        state.atEnd = false;
        state.frac = 0;
        state.confirmed = state.idx;
        state.paceHistory = [];
        state.elapsed = 0;
        state.lastSoundAt = -Infinity;
        state.wps = settings.wpm / 60;

        if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();

        document.body.classList.add('playing');
        el.scroller.scrollTop = 0;
        state.layoutDirty = true;
        state.scrollY = scrollTargetFor(state.idx);
        applyScroll();

        setStatus(null);
        updateHud();
        if (effectiveMode() === 'voice') voice.start(speechLocale());
        requestWakeLock();
        pokeHud();

        state.lastTick = performance.now();
        cancelAnimationFrame(state.raf);
        state.raf = requestAnimationFrame(frame);
    }

    function stop() {
        if (!state.playing) return;
        state.playing = false;
        state.paused = false;
        voice.stop();
        cancelAnimationFrame(state.raf);
        releaseWakeLock();
        exitFullscreen();
        clearTimeout(hudTimer);
        document.body.classList.remove('playing', 'hud-idle');
        el.scriptView.style.transform = '';
        setStatus(null);
        hideToast();
        if (state.idx >= state.words.length - 1) setIndex(0, true);
        state.layoutDirty = true;
        updateStartButton();
        positionPreview();
    }

    function pause(reachedEnd = false) {
        if (!state.playing || state.paused) return;
        state.paused = true;
        state.atEnd = reachedEnd;
        voice.stop();
        setStatus(reachedEnd ? t('end') : t('paused'));
        updateHud();
        pokeHud();
    }

    function resume() {
        if (!state.playing || !state.paused) return;
        if (state.idx >= state.words.length - 1) setIndex(0, true);
        state.paused = false;
        state.atEnd = false;
        state.frac = 0;
        state.confirmed = Math.max(state.confirmed, state.idx);
        state.paceHistory = [];
        state.lastSoundAt = -Infinity;
        setStatus(null);
        if (effectiveMode() === 'voice') voice.start(speechLocale());
        updateHud();
        pokeHud();
    }

    function togglePause() { state.paused ? resume() : pause(); }

    function frame(now) {
        if (!state.playing) return;
        const dt = Math.min(0.25, Math.max(0, (now - state.lastTick) / 1000));
        state.lastTick = now;
        tick(dt, now);
        state.raf = requestAnimationFrame(frame);
    }

    let hudRefreshAt = 0;
    function tick(dt, now) {
        const n = state.words.length;
        const mode = effectiveMode();

        if (!state.paused) {
            state.elapsed += dt;

            // Cruise control: advance at the estimated pace. In voice mode only while speech
            // is being heard, and never too far ahead of what recognition has confirmed.
            let advancing = false;
            if (mode === 'auto') {
                advancing = true;
            } else if (now - state.lastSoundAt < SOUND_HOLD_MS && state.idx < state.confirmed + MAX_LEAD) {
                advancing = true;
            }
            if (advancing && state.idx < n - 1) {
                const rate = mode === 'auto' ? settings.wpm / 60 : state.wps;
                state.frac += rate * dt;
                if (state.frac >= 1) {
                    const whole = Math.floor(state.frac);
                    state.frac -= whole;
                    let target = state.idx + whole;
                    if (mode === 'voice') target = Math.min(target, state.confirmed + MAX_LEAD);
                    setIndex(target);
                }
            }
            if (mode === 'auto' && state.idx >= n - 1) {
                state.frac = 0;
                pause(true);
            }
        }

        // Smoothly glide the text towards the target position.
        const target = scrollTargetFor(state.idx + (state.paused ? 0 : state.frac));
        const ease = 1 - Math.exp(-dt * 6);
        state.scrollY += (target - state.scrollY) * ease;
        if (Math.abs(target - state.scrollY) < 0.05) state.scrollY = target;
        applyScroll();

        if (now >= hudRefreshAt) {
            hudRefreshAt = now + 250;
            updateHud();
        }
    }

    function applyScroll() {
        el.scriptView.style.transform = `translate3d(0, ${(-state.scrollY).toFixed(2)}px, 0)`;
    }

    function adjustSpeed(delta) {
        if (effectiveMode() === 'auto') {
            settings.wpm = clamp(settings.wpm + delta, 40, 400);
            saveSettings();
            syncControls();
        } else {
            state.wps = clamp(state.wps + delta / 60, 0.8, 6);
        }
        updateHud();
        pokeHud();
    }

    // =====================================================================
    //  HUD, status and notices
    // =====================================================================
    function formatTime(seconds) {
        seconds = Math.max(0, Math.round(seconds));
        const m = Math.floor(seconds / 60);
        const s = String(seconds % 60).padStart(2, '0');
        return `${m}:${s}`;
    }

    function currentWpm() {
        return Math.round(effectiveMode() === 'auto' ? settings.wpm : state.wps * 60);
    }

    function updateHud() {
        const wpm = currentWpm();
        el.wpmReadout.textContent = `${wpm} ${t('wpmUnit')}`;
        const remaining = (state.words.length - 1 - state.idx) / Math.max(wpm / 60, 0.1);
        el.timeReadout.textContent = `${formatTime(state.elapsed)} / −${formatTime(remaining)}`;
        el.pauseLabel.textContent = state.paused ? t('resume') : t('pause');
        el.pauseIcon.toggleAttribute('hidden', state.paused);
        el.playIcon.toggleAttribute('hidden', !state.paused);
        el.pauseBtn.setAttribute('aria-label', state.paused ? t('resume') : t('pause'));
        el.micChip.hidden = effectiveMode() !== 'voice';
    }

    function updateProgress() {
        const n = state.words.length;
        el.progressBar.style.width = n > 1 ? `${(state.idx / (n - 1)) * 100}%` : '0%';
    }

    function setStatus(text) {
        el.statusBadge.hidden = !text;
        if (text) el.statusBadge.textContent = text;
    }

    let toastTimer = 0;
    function showNotice(text) {
        el.notice.textContent = text;
        el.notice.hidden = false;
        if (state.playing) {
            el.toast.textContent = text;
            el.toast.hidden = false;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(hideToast, 7000);
        }
    }
    function hideNotice() {
        el.notice.hidden = true;
        refreshSupportNotice();
    }
    function hideToast() { el.toast.hidden = true; }

    function refreshSupportNotice() {
        if (!voiceSupported && settings.mode === 'voice') {
            el.notice.textContent = t('errNoSpeech');
            el.notice.hidden = false;
        }
    }

    let hudTimer = 0;
    function pokeHud() {
        document.body.classList.remove('hud-idle');
        clearTimeout(hudTimer);
        if (state.playing && !state.paused) {
            hudTimer = setTimeout(() => document.body.classList.add('hud-idle'), 2500);
        }
    }

    // =====================================================================
    //  Wake lock & fullscreen
    // =====================================================================
    let wakeLock = null;
    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator && !wakeLock) {
                wakeLock = await navigator.wakeLock.request('screen');
                wakeLock.addEventListener('release', () => { wakeLock = null; });
            }
        } catch (e) { wakeLock = null; }
    }
    function releaseWakeLock() {
        if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
    }
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && state.playing) requestWakeLock();
    });

    const fullscreenSupported = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
    const fullscreenElement = () => document.fullscreenElement || document.webkitFullscreenElement;
    function toggleFullscreen() {
        if (!fullscreenSupported) return;
        if (fullscreenElement()) { exitFullscreen(); return; }
        const root = document.documentElement;
        const req = root.requestFullscreen || root.webkitRequestFullscreen;
        try { const p = req.call(root); if (p && p.catch) p.catch(() => {}); } catch (e) { /* denied */ }
    }
    function exitFullscreen() {
        if (!fullscreenElement()) return;
        const exit = document.exitFullscreen || document.webkitExitFullscreen;
        try { const p = exit.call(document); if (p && p.catch) p.catch(() => {}); } catch (e) { /* ignore */ }
    }

    // =====================================================================
    //  Settings UI
    // =====================================================================
    const RANGE_FORMAT = {
        wpm: (v) => `${v} ${t('wpmUnit')}`,
        fontSize: (v) => `${v}px`,
        lineHeight: (v) => Number(v).toFixed(1),
        padding: (v) => `${v}%`,
        eyeline: (v) => `${v}%`
    };

    function applyVisualSettings() {
        const root = document.documentElement.style;
        root.setProperty('--font-size', `${settings.fontSize}px`);
        root.setProperty('--line-height', String(settings.lineHeight));
        root.setProperty('--side', `${settings.padding}%`);
        root.setProperty('--eyeline', `${settings.eyeline}%`);
        const flips = [settings.mirror ? 'scaleX(-1)' : '', settings.flipV ? 'scaleY(-1)' : ''].join(' ').trim();
        root.setProperty('--flip', flips || 'none');
        el.scriptView.style.textAlign = settings.align;
        state.layoutDirty = true;
        positionPreview();
    }

    function syncControls() {
        for (const key of Object.keys(RANGE_FORMAT)) {
            const input = $(key);
            input.value = settings[key];
            $(key + 'Out').textContent = RANGE_FORMAT[key](settings[key]);
        }
        const mode = effectiveMode();
        document.querySelectorAll('[data-mode]').forEach((b) => {
            b.setAttribute('aria-checked', String(b.dataset.mode === mode));
            b.disabled = b.dataset.mode === 'voice' && !voiceSupported;
        });
        document.querySelectorAll('[data-align]').forEach((b) => {
            b.setAttribute('aria-checked', String(b.dataset.align === settings.align));
        });
        el.mirrorBtn.setAttribute('aria-pressed', String(settings.mirror));
        el.flipVBtn.setAttribute('aria-pressed', String(settings.flipV));
        el.modeHint.textContent = mode === 'voice' ? t('modeVoiceHint') : t('modeAutoHint');
        el.speechLangField.hidden = mode !== 'voice';
        el.uiLang.value = settings.uiLang;
        updateStats();
        updateHud();
    }

    function buildSpeechLangOptions() {
        const options = [['auto', t('autoDetect', { lang: langName(state.detected.locale) })]];
        const locales = new Set(SPEECH_LANGS);
        if (settings.speechLang !== 'auto') locales.add(settings.speechLang);
        const named = [...locales].map((loc) => [loc, langName(loc)]);
        named.sort((a, b) => a[1].localeCompare(b[1], settings.uiLang));
        options.push(...named);

        el.speechLang.replaceChildren(...options.map(([value, label]) => {
            const opt = document.createElement('option');
            opt.value = value;
            opt.textContent = label;
            return opt;
        }));
        el.speechLang.value = settings.speechLang;
    }

    function updateDetected() {
        el.detectedBadge.textContent = t('detected', { lang: langName(speechLocale()) });
        const autoOpt = el.speechLang.querySelector('option[value="auto"]');
        if (autoOpt) autoOpt.textContent = t('autoDetect', { lang: langName(state.detected.locale) });
    }

    function updateStats() {
        const count = state.words.length;
        const min = Math.max(1, Math.round(count / settings.wpm));
        el.scriptStats.textContent = t('stats', { words: count.toLocaleString(settings.uiLang), min, wpm: settings.wpm });
    }

    function updateStartButton() {
        const n = state.words.length;
        const fromMiddle = state.idx > 0 && state.idx < n - 1;
        el.startLabel.textContent = fromMiddle ? t('startFrom', { n: state.idx + 1 }) : t('start');
        el.toTopBtn.hidden = !fromMiddle;
    }

    function applyLanguage() {
        const lang = settings.uiLang;
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'he' ? 'rtl' : 'ltr';
        document.querySelectorAll('[data-i18n]').forEach((node) => { node.textContent = t(node.dataset.i18n); });
        el.slowerBtn.setAttribute('aria-label', t('slower'));
        el.slowerBtn.title = t('slower');
        el.fasterBtn.setAttribute('aria-label', t('faster'));
        el.fasterBtn.title = t('faster');
        el.fsBtn.setAttribute('aria-label', t('fullscreen'));
        el.fsBtn.title = `${t('fullscreen')} (F)`;
        el.stopBtn.title = `${t('stop')} (Esc)`;
        el.pauseBtn.title = `${t('pause')} / ${t('resume')} (Space)`;
        el.fsBtn.hidden = !fullscreenSupported;
        buildSpeechLangOptions();
        updateDetected();
        setListening(state.listening);
        updateStartButton();
        syncControls();
        if (!el.notice.hidden || (!voiceSupported && settings.mode === 'voice')) hideNotice();
        if (state.paused) setStatus(state.atEnd ? t('end') : t('paused'));
    }

    // =====================================================================
    //  Script text handling
    // =====================================================================
    function onTextChanged(resetPosition) {
        const text = el.script.value;
        const { words, lines } = tokenize(text);
        state.words = words;
        state.lines = lines;
        state.detected = detectLanguage(text);
        if (resetPosition || state.idx >= words.length) state.idx = 0;
        state.confirmed = state.idx;
        renderScript();
        updateDetected();
        updateStats();
        updateStartButton();
        updateProgress();
        positionPreview();
    }

    let textTimer = 0;
    el.script.addEventListener('input', () => {
        storage.set(TEXT_KEY, el.script.value);
        clearTimeout(textTimer);
        textTimer = setTimeout(() => onTextChanged(true), 150);
    });

    // =====================================================================
    //  Event wiring
    // =====================================================================
    el.uiLang.addEventListener('change', () => {
        settings.uiLang = el.uiLang.value;
        saveSettings();
        applyLanguage();
    });

    el.speechLang.addEventListener('change', () => {
        settings.speechLang = el.speechLang.value;
        saveSettings();
        updateDetected();
    });

    for (const key of Object.keys(RANGE_FORMAT)) {
        $(key).addEventListener('input', (e) => {
            settings[key] = Number(e.target.value);
            $(key + 'Out').textContent = RANGE_FORMAT[key](settings[key]);
            saveSettings();
            if (key === 'wpm') updateStats();
            else applyVisualSettings();
        });
    }

    document.querySelectorAll('[data-mode]').forEach((b) => b.addEventListener('click', () => {
        settings.mode = b.dataset.mode;
        saveSettings();
        hideNotice();
        syncControls();
    }));

    document.querySelectorAll('[data-align]').forEach((b) => b.addEventListener('click', () => {
        settings.align = b.dataset.align;
        saveSettings();
        syncControls();
        applyVisualSettings();
    }));

    el.mirrorBtn.addEventListener('click', () => {
        settings.mirror = !settings.mirror;
        saveSettings(); syncControls(); applyVisualSettings();
    });
    el.flipVBtn.addEventListener('click', () => {
        settings.flipV = !settings.flipV;
        saveSettings(); syncControls(); applyVisualSettings();
    });

    el.startBtn.addEventListener('click', start);
    el.toTopBtn.addEventListener('click', () => setIndex(0, true));
    el.stopBtn.addEventListener('click', stop);
    el.pauseBtn.addEventListener('click', togglePause);
    el.slowerBtn.addEventListener('click', () => adjustSpeed(-10));
    el.fasterBtn.addEventListener('click', () => adjustSpeed(10));
    el.fsBtn.addEventListener('click', toggleFullscreen);

    // Click/tap a word to jump there (sets the start point when not playing).
    el.scriptView.addEventListener('click', (e) => {
        const span = e.target.closest('.w');
        if (span) setIndex(Number(span.dataset.i), true);
    });

    // Mouse wheel / trackpad moves line by line while reading.
    let wheelAccum = 0;
    el.scroller.addEventListener('wheel', (e) => {
        if (!state.playing) return;
        e.preventDefault();
        wheelAccum += e.deltaMode === 1 ? e.deltaY * 30 : e.deltaY;
        while (Math.abs(wheelAccum) >= 60) {
            const dir = Math.sign(wheelAccum);
            stepLines(dir);
            wheelAccum -= dir * 60;
        }
        pokeHud();
    }, { passive: false });

    el.stage.addEventListener('pointermove', pokeHud);
    el.stage.addEventListener('pointerdown', pokeHud);

    // Keyboard, presentation clickers and joysticks (they send arrow / page keys).
    const STEP_KEYS = { ArrowUp: -1, ArrowLeft: -1, ArrowDown: 1, ArrowRight: 1, PageUp: -10, PageDown: 10 };
    let heldKey = null;
    let holdDelay = 0;
    let holdRepeat = 0;

    function releaseHeldKey() {
        heldKey = null;
        clearTimeout(holdDelay);
        clearInterval(holdRepeat);
    }

    window.addEventListener('keydown', (e) => {
        if (!state.playing || e.ctrlKey || e.metaKey || e.altKey) return;

        if (e.key in STEP_KEYS) {
            e.preventDefault();
            if (heldKey === e.key) return; // ignore OS auto-repeat; we run our own
            releaseHeldKey();
            heldKey = e.key;
            stepWords(STEP_KEYS[e.key]);
            holdDelay = setTimeout(() => {
                holdRepeat = setInterval(() => { if (heldKey) stepWords(STEP_KEYS[heldKey]); }, 90);
            }, 300);
            pokeHud();
            return;
        }

        let handled = true;
        switch (e.code) {
            case 'Space': if (!e.repeat) togglePause(); break;
            case 'Escape': stop(); break;
            case 'Home': setIndex(0, true); break;
            case 'End': setIndex(state.words.length - 1, true); break;
            case 'Equal': case 'NumpadAdd': adjustSpeed(10); break;
            case 'Minus': case 'NumpadSubtract': adjustSpeed(-10); break;
            case 'KeyF': if (!e.repeat) toggleFullscreen(); break;
            default: handled = false;
        }
        if (handled) e.preventDefault();
    });

    window.addEventListener('keyup', (e) => { if (e.key === heldKey) releaseHeldKey(); });
    window.addEventListener('blur', releaseHeldKey);

    // Re-measure when the reading area changes size (rotation, window resize, panel toggle).
    if ('ResizeObserver' in window) {
        new ResizeObserver(() => {
            state.layoutDirty = true;
            positionPreview();
        }).observe(el.scroller);
    } else {
        window.addEventListener('resize', () => { state.layoutDirty = true; positionPreview(); });
    }

    // =====================================================================
    //  Boot
    // =====================================================================
    const savedText = storage.get(TEXT_KEY);
    el.script.value = savedText !== null ? savedText : (SAMPLE_TEXT[settings.uiLang] || SAMPLE_TEXT.en);

    onTextChanged(true);
    applyVisualSettings();
    applyLanguage();
    refreshSupportNotice();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { state.layoutDirty = true; positionPreview(); });

    // Handy for debugging from the console.
    window.VibePrompter = { state, settings, start, stop, pause, resume, setIndex, matchSpeech, detectLanguage, tokenize };
})();
</script>
</body>
</html>
